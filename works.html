<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works</title>
  <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400&display=swap)" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/works.css">
</head>
<body class="works-body">

  <!-- 어드민 툴바 -->
  <header class="admin-toolbar">
    <div class="admin-toolbar-left">
      <a href="main.html" class="nav-btn">← Back</a>
      <span class="page-title-works">Works</span>
    </div>
    <div class="admin-toolbar-right">
      <button class="btn btn-import" id="btn-import">코드 불러오기</button>
      <input type="file" id="import-file-input" accept=".html" style="display:none;">
      <button class="btn btn-add" id="btn-add">+ 새 작업물</button>
      <button class="btn btn-export" id="btn-export">코드 출력</button>
    </div>
  </header>

  <!-- 게시물 목록 -->
  <main class="works-list" id="works-list"></main>

  <!-- 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box">
      <h2 class="modal-title" id="modal-title">새 작업물 추가</h2>

      <div class="form-group">
        <label class="form-label" for="form-title">제목</label>
        <input type="text" id="form-title" class="form-input" placeholder="작업물 제목">
      </div>

      <div class="form-group">
        <label class="form-label" for="form-desc">설명</label>
        <textarea id="form-desc" class="form-textarea" placeholder="작업물 설명"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="form-image-url">이미지 URL</label>
        <input
          type="url"
          id="form-image-url"
          class="form-input"
          placeholder="[i.imgur.com](https://i.imgur.com/example.jpg)"
        >
        <img id="img-preview" class="image-preview" src="" alt="" style="margin-top:0.8rem;">
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" id="btn-cancel">취소</button>
        <button class="btn" id="btn-save">저장</button>
      </div>
    </div>
  </div>

  <script src="js/works.js"></script>
</body>
</html>
